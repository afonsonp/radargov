# Revisao de seguranca a cada commit de um PR
# (anthropics/claude-code-security-review).
#
# Entrou a 8/09/2026, no dia a seguir ao painel ir para a internet em
# radargov.pt. Le so o diff do PR e comenta nas linhas; o segredo
# CLAUDE_API_KEY tem de existir em Settings > Secrets > Actions.
#
# run-every-commit: true (15/09/2026, decisao do Afonso). Sem ele --
# e `false` e o valor por omissao -- a accao varre o PRIMEIRO commit
# de cada PR e mais nenhum: reserva um lugar por PR num
# `.claudecode-marker/marker.json` guardado na cache das Actions, e
# restaura-o por PREFIXO (`claudecode-<repo>-pr-<n>-`) e nao pelo SHA,
# por isso o marcador de qualquer commit anterior do mesmo PR serve.
# Encontrado o marcador, o passo do varrimento fica `skipped` e o job
# da VERDE sem ter lido uma linha.
#
# Pior: o marcador grava-se ANTES de a chave ser validada. Sem o
# segredo criado, a primeira corrida de um PR deixa a reserva e so
# depois rebenta; as seguintes saltam e passam. E o que se viu no
# PR #19 a 14/09 (a corrida #19 vermelha, a #20 e a #21 verdes) e no
# PR #21 a 15/09, que foi onde isto se descobriu -- ver o
# docs/diario/2026-09.md desse dia.
#
# Com `true`, cada push e varrido e um verde volta a querer dizer
# alguma coisa. Enquanto o segredo nao existir, o que isto muda e que
# TODAS as corridas ficam vermelhas em vez de so a primeira: e o
# comportamento honesto, porque nenhuma esta a rever seja o que for.
#
# A pasta documentos/ e as bases nao entram no git, por isso nao ha
# nada a excluir aqui.
name: Segurança

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:

jobs:
  revisao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          custom-security-scan-instructions: .github/seguranca-radar.md
          run-every-commit: true
